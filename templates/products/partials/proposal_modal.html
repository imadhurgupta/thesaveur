<!-- Make Offer / Proposal Modal Component -->
<div class="mo-modal-overlay" id="makeOfferModal" onclick="if(event.target===this) closeOfferModal()">
  <div class="mo-modal-content">
    <div class="mo-modal-header">
      <h3>Make an Offer</h3>
      <p>Submit your proposed deal for <strong>{{ product.name }}</strong>. We will review and reply within 24 hours.</p>
    </div>
    <form action="{{ url_for('submit_proposal') }}" method="POST">
      <input type="hidden" name="product_id" value="{{ product.id }}">
      <input type="hidden" name="product_name" value="{{ product.name }}">

      <div class="mo-form-row">
        <div class="mo-input-group">
          <label class="mo-label">Proposed Price ($)</label>
          <input type="number" name="proposed_price" id="mo-proposed-price" class="mo-input" step="0.01" min="1" required>
        </div>
        <div class="mo-input-group">
          <label class="mo-label">Quantity Required</label>
          <input type="number" name="proposed_qty" id="mo-proposed-qty" class="mo-input" min="1" required>
        </div>
      </div>

      <div class="mo-input-group">
        <label class="mo-label">Your Name</label>
        <input type="text" name="name" class="mo-input" placeholder="Enter your full name" required>
      </div>

      <div class="mo-form-row">
        <div class="mo-input-group">
          <label class="mo-label">Email Address</label>
          <input type="email" name="email" class="mo-input" placeholder="name@example.com" required>
        </div>
        <div class="mo-input-group">
          <label class="mo-label">Phone Number</label>
          <input type="tel" name="phone" class="mo-input" placeholder="e.g. +91 98765 43210">
        </div>
      </div>

      <div class="mo-input-group">
        <label class="mo-label">Message / Deal Details (Optional)</label>
        <textarea name="message" class="mo-textarea" placeholder="Explain your proposal (e.g. regular buyer, custom specifications, delivery timeline...)"></textarea>
      </div>

      <div class="mo-buttons">
        <button type="button" class="mo-btn-cancel" onclick="closeOfferModal()">Cancel</button>
        <button type="submit" class="mo-btn-submit">Submit Offer</button>
      </div>
    </form>
  </div>
</div>

<!-- Lightbox Modal with Swipe & Navigation -->
<div id="pd-lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; touch-action: pan-y pinch-zoom; user-select: none;">
  <div class="pd-lb-counter" id="pd-lb-counter">1 / 1</div>
  <span style="position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; z-index: 10002;" onclick="closeLightbox()">&times;</span>
  <button type="button" class="pd-lb-btn pd-lb-prev" id="pd-lb-prev" aria-label="Previous media" onclick="event.stopPropagation(); prevMediaLightbox();">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button type="button" class="pd-lb-btn pd-lb-next" id="pd-lb-next" aria-label="Next media" onclick="event.stopPropagation(); nextMediaLightbox();">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
  <div id="pd-lightbox-content" style="max-width: 90%; max-height: 90%; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
    <!-- Dynamic image or video injected via JS -->
  </div>
</div>
