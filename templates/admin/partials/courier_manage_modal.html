<!-- Manage Custom Couriers Modal -->
<div id="manage-couriers-modal" onclick="if(event.target === this) closeManageCouriersModal()" style="display:none; position:fixed; inset:0; z-index:99999999; background:rgba(15, 23, 42, 0.65); backdrop-filter:blur(5px); align-items:center; justify-content:center; padding:16px;">
  <div style="background:#ffffff; width:100%; max-width:580px; border-radius:16px; box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.35); overflow:hidden; display:flex; flex-direction:column; max-height:90vh; position:relative; z-index:100000000;">
    
    <!-- Modal Header -->
    <div style="padding:16px 20px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; background:#f8fafc;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:34px; height:34px; border-radius:8px; background:#ecfdf5; color:#059669; display:flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        </div>
        <div>
          <h3 style="margin:0; font-size:1rem; font-weight:700; color:#0f172a;">Custom Courier Directory</h3>
          <p style="margin:0; font-size:0.75rem; color:#64748b;">Manage your saved courier partners &amp; tracking URL patterns</p>
        </div>
      </div>
      <button type="button" onclick="closeManageCouriersModal()" style="background:none; border:none; color:#94a3b8; font-size:1.25rem; font-weight:600; cursor:pointer; line-height:1; padding:4px;">✕</button>
    </div>

    <!-- Modal Body / Couriers List -->
    <div style="padding:16px 20px; overflow-y:auto; flex:1; max-height:380px;">
      <div id="modal-couriers-loading" style="text-align:center; padding:30px; color:#64748b; font-size:0.85rem;">
        Loading saved courier partners...
      </div>
      <div id="modal-couriers-empty" style="display:none; text-align:center; padding:30px 15px; color:#64748b;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36" style="margin:0 auto 10px; color:#cbd5e1; display:block;"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <p style="margin:0 0 4px; font-weight:600; font-size:0.9rem; color:#334155;">No Custom Couriers Found</p>
        <p style="margin:0; font-size:0.78rem;">Add custom courier partners using the button below or in the dispatch panel.</p>
      </div>
      <div id="modal-couriers-list" style="display:none; flex-direction:column; gap:8px;">
        <!-- Dynamically injected courier items -->
      </div>
    </div>

    <!-- Modal Footer -->
    <div style="padding:12px 20px; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; background:#f8fafc;">
      <button type="button" onclick="openCourierPanelFromModal('add')" style="background:#10b981; color:#ffffff; border:none; padding:7px 14px; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>+ Add New Partner</span>
      </button>
      <button type="button" onclick="closeManageCouriersModal()" style="background:#ffffff; color:#475569; border:1px solid #cbd5e1; padding:7px 14px; border-radius:8px; font-size:0.8rem; font-weight:600; cursor:pointer;">
        Done
      </button>
    </div>

  </div>
</div>
