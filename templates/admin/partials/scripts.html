  // Tabs switcher logic

  function switchTab(evt, tabId) {

    // Hide all contents

    document.querySelectorAll('.tab-content').forEach(content => {

      content.classList.remove('active');

    });

    

    // Remove active state from all buttons

    document.querySelectorAll('.tab-btn').forEach(btn => {

      btn.classList.remove('active');

    });



    // Show current tab and activate button

    const targetTab = document.getElementById(tabId);

    if (targetTab) targetTab.classList.add('active');



    if (evt && evt.currentTarget) {

      evt.currentTarget.classList.add('active');

    } else {

      const btn = Array.from(document.querySelectorAll('.tab-btn')).find(b => {

        const onc = b.getAttribute('onclick');

        return onc && onc.includes(tabId);

      });

      if (btn) btn.classList.add('active');

    }

    localStorage.setItem('admin_active_tab', tabId);

  }

  // Select inbox message
  function selectMessage(element) {
    // Toggle active class on list card
    document.querySelectorAll('.msg-card').forEach(card => {
      card.classList.remove('active');
    });
    element.classList.add('active');

    // Load data attributes
    const name = element.getAttribute('data-name');
    const email = element.getAttribute('data-email');
    const phone = element.getAttribute('data-phone');
    const interest = element.getAttribute('data-interest');
    const date = element.getAttribute('data-date');
    const message = element.getAttribute('data-message');
    const id = element.getAttribute('data-id');
    const status = element.getAttribute('data-status') || 'Pending';

    // Update detail elements
    const detailName = document.getElementById('msg-detail-name');
    if (detailName) detailName.innerText = name;
    
    const emailLink = document.getElementById('msg-detail-email');
    if (emailLink) {
      emailLink.innerText = email;
      emailLink.href = 'mailto:' + email;
    }
    
    const phoneLink = document.getElementById('msg-detail-phone');
    if (phoneLink) {
      phoneLink.innerText = phone || 'N/A';
      phoneLink.href = phone ? 'tel:' + phone : '#';
    }

    const detailDate = document.getElementById('msg-detail-date');
    if (detailDate) detailDate.innerText = date;

    const detailInterest = document.getElementById('msg-detail-interest');
    if (detailInterest) detailInterest.innerText = interest;

    const detailBody = document.getElementById('msg-detail-body');
    if (detailBody) detailBody.innerText = message;

    // Update status badge
    const statusSpan = document.getElementById('msg-detail-status');
    if (statusSpan) {
      statusSpan.innerText = status;
      if (status === 'Accepted') {
        statusSpan.style.background = '#e8f5e9';
        statusSpan.style.color = '#2e7d32';
      } else if (status === 'Declined') {
        statusSpan.style.background = '#ffebee';
        statusSpan.style.color = '#c62828';
      } else {
        statusSpan.style.background = '#fff3e0';
        statusSpan.style.color = '#ef6c00';
      }
    }

    // Update action buttons
    const actionEmail = document.getElementById('msg-action-email');
    if (actionEmail) {
      actionEmail.href = 'mailto:' + email + '?subject=Regarding your proposal for ' + encodeURIComponent(interest);
    }
    
    const waCleanPhone = (phone || '').replace(/[^\d]/g, '');
    const waLink = document.getElementById('msg-action-wa');
    if (waLink) {
      if (waCleanPhone) {
        waLink.style.display = 'inline-flex';
        waLink.href = 'https://wa.me/' + waCleanPhone + '?text=' + encodeURIComponent('Hi ' + name + ', regarding your offer/enquiry for ' + interest + '...');
      } else {
        waLink.style.display = 'none';
      }
    }

    // Toggle and update Accept / Decline forms
    const isDeal = message.indexOf('PROPOSED DEAL') !== -1;
    const acceptForm = document.getElementById('msg-action-accept-form');
    const declineForm = document.getElementById('msg-action-decline-form');
    if (acceptForm && declineForm) {
      if (isDeal && status === 'Pending') {
        acceptForm.style.display = 'block';
        declineForm.style.display = 'block';
        acceptForm.action = '/admin/enquiry/update-status/' + id + '/Accepted';
        declineForm.action = '/admin/enquiry/update-status/' + id + '/Declined';
      } else {
        acceptForm.style.display = 'none';
        declineForm.style.display = 'none';
      }
    }

    // Update delete form action
    const deleteForm = document.getElementById('msg-action-delete-form');
    if (deleteForm) {
      deleteForm.action = '/admin/delete-enquiry/' + id;
    }
  }

  let activeImages = [];

  // Stores actual File objects for local uploads so they can be attached to the form
  let localFileObjects = [];

  // Previews local uploaded files — the real input is inside <label> so FormData picks it up automatically
  function handleLocalFiles(files) {
    // Show file names label
    const chosenEl = document.getElementById('prod-file-chosen');
    if (chosenEl) {
      if (files.length === 0) {
        chosenEl.textContent = '';
      } else if (files.length === 1) {
        chosenEl.textContent = '✔ Selected: ' + files[0].name;
      } else {
        chosenEl.textContent = '✔ Selected: ' + files.length + ' files (' + Array.from(files).map(f => f.name).join(', ') + ')';
      }
    }

    // Build preview gallery
    // Clear existing local images from activeImages, keep remote ones
    activeImages = activeImages.filter(img => img.type !== 'local');

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const objectUrl = URL.createObjectURL(file);
      activeImages.push({
        type: 'local',
        name: file.name,
        url: objectUrl,
        fileObj: file
      });
    }
    updateSelectedImagesGallery();
  }

  // Syncs File objects back to the file input (fallback for removeImageFromGallery)
  function syncLocalFilesToInput() {
    const inputEl = document.getElementById('prod-local-images');
    if (!inputEl || typeof DataTransfer === 'undefined') return;
    try {
      const dt = new DataTransfer();
      activeImages.forEach(img => {
        if (img.type === 'local' && img.fileObj) {
          dt.items.add(img.fileObj);
        }
      });
      inputEl.files = dt.files;
      // Update label
      const chosenEl = document.getElementById('prod-file-chosen');
      if (chosenEl) {
        const count = dt.files.length;
        chosenEl.textContent = count === 0 ? '' : (count === 1 ? '✔ Selected: ' + dt.files[0].name : '✔ Selected: ' + count + ' files');
      }
    } catch(e) {
      console.warn('DataTransfer not supported, file list may not update:', e);
    }
  }



  // Real Google Picker & OneDrive SDK Integrations

  let oauthToken = null;



  function openGooglePickerAPI() {

    if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes("your-google-client-id")) {

      alert("Please configure a valid GOOGLE_CLIENT_ID in your .env file to use the Google Picker API.");

      return;

    }

    

    try {

      const client = google.accounts.oauth2.initTokenClient({

        client_id: GOOGLE_CLIENT_ID,

        scope: 'https://www.googleapis.com/auth/drive.readonly',

        callback: (tokenResponse) => {

          if (tokenResponse && tokenResponse.access_token) {

            oauthToken = tokenResponse.access_token;

            loadGooglePicker(oauthToken);

          }

        },

      });

      client.requestAccessToken();

    } catch (e) {

      console.error(e);

      alert("Failed to initialize Google Auth Client. Please make sure Google Identity Services SDK is loaded and GOOGLE_CLIENT_ID is correct.");

    }

  }



  function loadGooglePicker(token) {

    gapi.load('picker', {

      callback: () => {

        const view = new google.picker.View(google.picker.ViewId.DOCS);

        view.setMimeTypes('image/png,image/jpeg,image/jpg,image/webp');

        

        const picker = new google.picker.PickerBuilder()

          .addView(view)

          .setOAuthToken(token)

          .setDeveloperKey(GOOGLE_API_KEY)

          .setCallback(googlePickerCallback)

          .build();

        picker.setVisible(true);

      }

    });

  }



  function googlePickerCallback(data) {

    if (data.action == google.picker.Action.PICKED) {

      const doc = data.docs[0];

      const name = doc.name;

      const fileId = doc.id;

      const directUrl = `https://lh3.googleusercontent.com/d/${fileId}`;

      

      if (!activeImages.some(img => img.name === name)) {

        activeImages.push({

          type: 'remote',

          name: name,

          url: directUrl

        });

        updateSelectedImagesGallery();

      }

    }

  }



  function openOneDrivePickerSDK() {

    const odOptions = {

      clientId: ONEDRIVE_CLIENT_ID || "00000000-0000-0000-0000-000000000000",

      action: "share",

      multiSelect: true,

      openInNewWindow: true,

      advanced: {

        redirectUri: window.location.origin + "/admin/dashboard"

      },

      success: function(files) {

        if (files && files.value) {

          files.value.forEach(file => {

            const name = file.name;

            const embedUrl = file.permissions && file.permissions[0] && file.permissions[0].link 

              ? file.permissions[0].link.webUrl 

              : file.webUrl;

            

            let directUrl = embedUrl;

            if (embedUrl.includes("redir")) {

              directUrl = embedUrl.replace("redir", "embed");

            }

            

            if (!activeImages.some(img => img.name === name)) {

              activeImages.push({

                type: 'remote',

                name: name,

                url: directUrl

              });

            }

          });

          updateSelectedImagesGallery();

        }

      },

      cancel: function() {

        console.log("OneDrive picker cancelled");

      },

      error: function(e) {

        console.error("OneDrive picker error", e);

        alert("OneDrive Picker SDK requires a valid Client ID configured. You can paste the direct shared URL instead!");

      }

    };

    

    if (typeof OneDrive !== "undefined") {

      OneDrive.open(odOptions);

    } else {

      alert("OneDrive SDK is still loading or blocked. Please paste the direct sharing link below instead!");

    }

  }



  // Paste URL Resolvers

  function resolveGoogleDriveUrl() {

    const input = document.getElementById('gdrive-paste-url');

    const url = input.value.trim();

    if (!url) {

      alert("Please paste a Google Drive link first.");

      return;

    }

    

    const match = url.match(/(?:https?:\/\/)?drive\.google\.com\/(?:file\/d\/|open\?id=)([^/?\s&]+)/);

    if (match && match[1]) {

      const fileId = match[1];

      const directUrl = `https://lh3.googleusercontent.com/d/${fileId}`;

      const name = `gdrive_${fileId.substring(0, 8)}.jpg`;

      

      if (!activeImages.some(img => img.name === name)) {

        activeImages.push({

          type: 'remote',

          name: name,

          url: directUrl

        });

        updateSelectedImagesGallery();

        input.value = '';

        alert("Google Drive sharing link successfully resolved!");

      } else {

        alert("This image is already added.");

      }

    } else {

      alert("Invalid Google Drive URL. Format must include 'file/d/FILE_ID' or 'open?id=FILE_ID'.");

    }

  }



  function resolveOneDriveUrl() {

    const input = document.getElementById('onedrive-paste-url');

    const url = input.value.trim();

    if (!url) {

      alert("Please paste a OneDrive link first.");

      return;

    }

    

    fetch('/api/resolve-onedrive', {

      method: 'POST',

      headers: {

        'Content-Type': 'application/json'

      },

      body: JSON.stringify({ url: url })

    })

    .then(res => res.json())

    .then(data => {

      if (data.success && data.resolved_url) {

        const directUrl = data.resolved_url;

        const name = `onedrive_${Math.random().toString(36).substring(2, 10)}.jpg`;

        

        if (!activeImages.some(img => img.name === name)) {

          activeImages.push({

            type: 'remote',

            name: name,

            url: directUrl

          });

          updateSelectedImagesGallery();

          input.value = '';

          alert("OneDrive sharing link successfully resolved!");

        } else {

          alert("This image is already added.");

        }

      } else {

        alert("Error resolving OneDrive URL: " + (data.error || "Unknown error"));

      }

    })

    .catch(err => {

      console.error(err);

      alert("Failed to resolve OneDrive URL.");

    });

  }



  function removeImageFromGallery(index) {
    activeImages.splice(index, 1);
    syncLocalFilesToInput();   // re-sync after removal
    updateSelectedImagesGallery();
  }



  function updateSelectedImagesGallery() {

    const gallery = document.getElementById('selected-images-gallery');

    gallery.innerHTML = '';

    

    if (activeImages.length === 0) {

      gallery.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; margin:auto; font-style:italic;" id="gallery-empty-msg">No images selected yet</div>';

      document.getElementById('prod-remote-images').value = '';

      document.getElementById('prod-image').value = '';

      return;

    }

    

    activeImages.forEach((img, index) => {

      const card = document.createElement('div');

      card.className = 'selected-img-badge';

      

      let imgSrc = img.url;

      // If it's a local filename (not url / blob), resolve from static folder

      if (img.type === 'remote' && !img.url.startsWith('http') && !img.url.startsWith('blob')) {

        imgSrc = "/static/images/" + img.url;

      }

      

      card.innerHTML = `

        <button type="button" class="selected-img-remove" onclick="removeImageFromGallery(${index})">&times;</button>

        <img src="${imgSrc}" alt="${img.name}" />

      `;

      

      gallery.appendChild(card);

    });

    

    // Sync to hidden input

    const remoteList = activeImages

      .filter(img => img.type === 'remote')

      .map(img => img.url);

    

    document.getElementById('prod-remote-images').value = remoteList.join(',');

    document.getElementById('prod-image').value = remoteList.join(',');

  }

    const filtered = allSubcategories.filter(s => s.category === selectedCategory);

      if (s.name === selectedSubValue) {
        opt.selected = true;

      subSelect.appendChild(opt);
    });
  }

// Bulk Product Deletion Javascript
function toggleSelectAllProducts(master) {
  const checkboxes = document.querySelectorAll('.product-checkbox');
  checkboxes.forEach(cb => {
    cb.checked = master.checked;
  });
  updateBulkDeleteBtn();
}

function updateBulkDeleteBtn() {
  const checkboxes = document.querySelectorAll('.product-checkbox');
  const bulkBtn = document.getElementById('bulk-delete-btn');
  const selectedCountSpan = document.getElementById('selected-count');
  
  let checkedCount = 0;
  checkboxes.forEach(cb => {
    if (cb.checked) checkedCount++;
  });
  
  if (selectedCountSpan) {
    selectedCountSpan.textContent = checkedCount;
  }
  
  if (bulkBtn) {
    if (checkedCount > 0) {
      bulkBtn.style.display = 'inline-flex';
      bulkBtn.disabled = false;
    } else {
      bulkBtn.style.display = 'none';
      bulkBtn.disabled = true;
    }
  }
  
  // Update select all checkbox state
  const selectAll = document.getElementById('select-all-products');
  if (selectAll) {
    selectAll.checked = (checkedCount === checkboxes.length && checkboxes.length > 0);
  }
}

function confirmBulkDelete(e) {
  const checkboxes = document.querySelectorAll('.product-checkbox');
  let checkedCount = 0;
  checkboxes.forEach(cb => {
    if (cb.checked) checkedCount++;
  });
  
  if (checkedCount === 0) {
    e.preventDefault();
    return false;
  }
  
  if (!confirm(`Are you sure you want to delete the ${checkedCount} selected products?`)) {
    e.preventDefault();
    return false;
  }
  return true;
}

  function playNotificationSound() {

    try {

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const osc1 = audioCtx.createOscillator();

      const osc2 = audioCtx.createOscillator();

      const gainNode = audioCtx.createGain();

      

      osc1.type = 'sine';

      osc2.type = 'sine';

      

      osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5

      osc1.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5

      

      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

      

      osc1.connect(gainNode);

      gainNode.connect(audioCtx.destination);

      

      osc1.start();

      osc1.stop(audioCtx.currentTime + 0.4);

    } catch (e) {

      console.error("Audio play failed", e);

    }

  }

      container.style.position = 'fixed';

      container.style.top = '24px';

      container.style.right = '24px';

      container.style.zIndex = '9999';

      container.style.display = 'flex';

      container.style.flexDirection = 'column';

      container.style.gap = '12px';

      document.body.appendChild(container);

    }

    

    const toast = document.createElement('div');

    toast.style.background = 'var(--white)';

    toast.style.padding = '12px 18px';

  function updateOrderStatusAjax(selectElement, orderId) {

    const status = selectElement.value;

    const badge = document.getElementById('order-status-badge-' + orderId);

    selectElement.disabled = true;

    

    fetch('/admin/update-order-status/' + orderId, {

      method: 'POST',

      headers: {

        'Content-Type': 'application/json'

      },

      body: JSON.stringify({ status: status })

    })

    .then(res => res.json())

    .then(data => {

      selectElement.disabled = false;

      if (data.success) {

        if (badge) {

          badge.textContent = status;

          badge.className = 'badge ' + status.toLowerCase();

          let bg = 'rgba(231,76,60,0.1)';

          let color = '#e74c3c';

          if (status === 'Processing') {

            bg = 'rgba(52,152,219,0.1)';

            color = '#3498db';

          } else if (status === 'Shipped') {

            bg = 'rgba(230,126,34,0.1)';

            color = '#e67e22';

          } else if (status === 'Delivered') {

            bg = 'rgba(46,204,113,0.1)';

            color = '#2ecc71';

          }

          badge.style.background = bg;

          badge.style.color = color;

        }

        showStatusSuccessToast(orderId, status);

      } else {

        alert("Failed to update status: " + (data.error || "Unknown error"));

      }

    })

    .catch(err => {

      selectElement.disabled = false;

      console.error(err);

      alert("Error updating order status.");

    });

  }



  function pollOrdersData() {

    fetch('/api/admin/orders')

      .then(res => res.json())

      .then(orders => {

        let hasNew = false;

        const orderStat = document.querySelector('.stats-grid .stat-card:nth-child(3) .stat-number');

        if (orderStat) {

          orderStat.textContent = orders.length;

        }



        orders.forEach(ord => {

          if (!ordersListCache.includes(ord.id)) {

            ordersListCache.push(ord.id);

            hasNew = true;

            showOrderToast(ord.id, ord.user_name, ord.total_amount);

          }

        });

        

        if (hasNew) {

          rebuildOrdersTable(orders);

        } else {

          orders.forEach(ord => {

            const select = document.querySelector(`#order-row-${ord.id} select[name="status"]`);

            if (select && select.value !== ord.status) {

              select.value = ord.status;

              const badge = document.getElementById('order-status-badge-' + ord.id);

              if (badge) {

                badge.textContent = ord.status;

                badge.className = 'badge ' + ord.status.toLowerCase();

                let bg = 'rgba(231,76,60,0.1)';

                let color = '#e74c3c';

                if (ord.status === 'Processing') {

                  bg = 'rgba(52,152,219,0.1)';

                  color = '#3498db';

                } else if (ord.status === 'Shipped') {

                  bg = 'rgba(230,126,34,0.1)';

                  color = '#e67e22';

                } else if (ord.status === 'Delivered') {

                  bg = 'rgba(46,204,113,0.1)';

                  color = '#2ecc71';

                }

                badge.style.background = bg;

                badge.style.color = color;

              }

            }

          });

        }

      })

      .catch(err => console.error("Error polling orders:", err));

  }



  function rebuildOrdersTable(orders) {

    const wrapper = document.getElementById('admin-orders-table-wrapper');

    const emptyMsg = document.getElementById('no-orders-msg');

    const tbody = document.getElementById('admin-orders-tbody');

    

    if (orders.length > 0) {

      wrapper.style.display = 'block';

      emptyMsg.style.display = 'none';

    } else {

      wrapper.style.display = 'none';

      emptyMsg.style.display = 'block';

      return;

    }

    

    tbody.innerHTML = '';

    orders.forEach(ord => {

      const tr = document.createElement('tr');

      tr.id = `order-row-${ord.id}`;

      let itemsHtml = '';

      ord.items.forEach(item => {

        itemsHtml += `&bull; ${item.product_name} (${item.quantity}x)<br>`;

      });

      const createdDate = ord.created_at ? ord.created_at.split(' ')[0] : '';

      let bg = 'rgba(231,76,60,0.1)';

      let color = '#e74c3c';

      if (ord.status === 'Processing') {

        bg = 'rgba(52,152,219,0.1)';

        color = '#3498db';

      } else if (ord.status === 'Shipped') {

        bg = 'rgba(230,126,34,0.1)';

        color = '#e67e22';

      } else if (ord.status === 'Delivered') {

        bg = 'rgba(46,204,113,0.1)';

        color = '#2ecc71';

      }

      

      tr.innerHTML = `

        <td><strong>${ord.order_number || ('#' + ord.id)}</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">${createdDate}</span></td>

        <td><strong>${ord.user_name}</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">${ord.user_email}</span></td>

        <td>

          <div style="font-size:0.85rem; line-height:1.4;">

            ${itemsHtml}

          </div>

        </td>

        <td>
          <strong>$${ord.total_amount}</strong><br>
          <small style="color:var(--text-muted); font-size:0.75rem;">(Includes $${parseFloat(ord.shipping_charge || 0).toFixed(2)} shipping)</small>
        </td>

        <td style="max-width:200px; font-size:0.85rem; line-height:1.4;">

          ${ord.shipping_address}<br>

          ${ord.city}, ${ord.state} - ${ord.zip_code}

        </td>

        <td>

          <span class="badge ${ord.status.toLowerCase()}" id="order-status-badge-${ord.id}" style="background:${bg}; color:${color}; font-weight:600;">

            ${ord.status}

          </span>

        </td>

        <td>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <form action="/admin/update-order-status/${ord.id}" method="POST" style="display:flex; gap:6px; align-items:center;" onsubmit="event.preventDefault()">
              <select name="status" style="padding:6px; font-size:0.8rem; border-radius:4px; border:1px solid rgba(0,0,0,0.15);" onchange="updateOrderStatusAjax(this, ${ord.id})">
                <option value="Processing" ${ord.status === 'Processing' ? 'selected' : ''}>Processing</option>
                <option value="Shipped" ${ord.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option value="Delivered" ${ord.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                <option value="Cancelled" ${ord.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </form>
            <a href="/admin/orders/${ord.id}"
               title="View Order Details"
               style="display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:6px; background:rgba(90,158,53,0.1); color:var(--green-primary); border:1px solid rgba(90,158,53,0.2); text-decoration:none; transition:background 0.2s;"
               onmouseover="this.style.background='rgba(90,158,53,0.2)'" onmouseout="this.style.background='rgba(90,158,53,0.1)'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </a>
          </div>
        </td>

      `;

      tbody.appendChild(tr);

    });

  }


  function openShippingModal() {
    document.getElementById('shipping-modal-title').textContent = 'Add Shipping Rate';
    document.getElementById('shipping-modal-form').action = "/admin/shipping/add";
    document.getElementById('ship-state').value = '';
    document.getElementById('ship-state').readOnly = false;
    document.getElementById('ship-charge').value = '0.00';
    openModal('shipping-modal');
  }

  function openEditShippingModal(id, state, charge) {
    document.getElementById('shipping-modal-title').textContent = 'Edit Shipping Rate';
    document.getElementById('shipping-modal-form').action = "/admin/shipping/edit/" + id;
    document.getElementById('ship-state').value = state;
    if (state.toUpperCase() === 'DEFAULT') {
      document.getElementById('ship-state').readOnly = true;
    } else {
      document.getElementById('ship-state').readOnly = false;
    }
    document.getElementById('ship-charge').value = charge;
    openModal('shipping-modal');
  }


  // Close modals when clicking outside card area

  document.querySelectorAll('.modal-overlay').forEach(overlay => {

    overlay.addEventListener('click', (e) => {

      if (e.target === overlay) {

        closeModal(overlay.id);

      }

    });

  });

</script>
