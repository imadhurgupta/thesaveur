<style>
  /* ═══ Google Fonts & Core Overrides ══════════════════════════ */
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

  body, html {
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden !important;
    font-family: 'Outfit', sans-serif;
    background: #f8fafc !important;
  }

  /* Completely isolate dashboard from standard site layout */
  .footer, header, .nav-wrapper, .navbar {
    display: none !important;
  }

  /* ═══ Dashboard Page Container ════════════════════════════════ */
  .order-detail-page {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%) !important;
    padding: 20px 24px !important;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    overflow: hidden;
    z-index: 999999;
    color: #334155;
  }

  /* ═══ Header & Navigation Bar ═════════════════════════════════ */
  .od-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .od-back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #64748b;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .od-back-link:hover {
    color: #10b981;
    transform: translateX(-4px);
  }
  .od-back-link svg {
    width: 16px;
    height: 16px;
    stroke-width: 2.5;
  }

  .od-header-main {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .od-title-block h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: #065f46; /* Warm Forest Green */
    margin: 0 0 6px 0;
  }

  .od-meta-tags {
    display: flex;
    gap: 16px;
    font-size: 0.85rem;
    color: #64748b;
  }
  .od-meta-tags span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ═══ Live Glowing Badges ═════════════════════════════════════ */
  .od-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: all 0.3s ease;
  }
  
  .od-status-badge.processing {
    background: rgba(59, 130, 246, 0.08);
    color: #2563eb;
    border: 1px solid rgba(59, 130, 246, 0.2);
  }
  .od-status-badge.shipped {
    background: rgba(245, 158, 11, 0.08);
    color: #d97706;
    border: 1px solid rgba(245, 158, 11, 0.2);
  }
  .od-status-badge.delivered {
    background: rgba(16, 185, 129, 0.08);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }
  .od-status-badge.cancelled {
    background: rgba(239, 68, 68, 0.08);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  .od-status-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: badge-pulse 1.8s infinite;
  }
  .od-status-badge.delivered .dot,
  .od-status-badge.cancelled .dot {
    animation: none;
  }

  @keyframes badge-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.35); }
  }

  /* ═══ Premium White Cards ════════════════════════════════════ */
  .od-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 640px;
    gap: 24px;
  }

  .od-grid > div {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .od-card {
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .od-card:hover {
    border-color: rgba(16, 185, 129, 0.2);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
  }

  .od-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    background: rgba(0, 0, 0, 0.005);
  }

  .od-card-header h2 {
    font-size: 0.95rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .od-card-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(16, 185, 129, 0.08);
    color: #10b981;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .od-card-icon svg {
    width: 15px;
    height: 15px;
  }

  .od-card-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
  }

  /* ═══ Ordered Items & List Row ════════════════════════════════ */
  .od-items-container {
    height: 100%;
    overflow-y: auto;
    padding-right: 4px;
  }

  .od-item-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    transition: background 0.2s ease;
  }
  .od-item-row:first-child { padding-top: 0; }
  .od-item-row:last-child { padding-bottom: 0; border-bottom: none; }
  .od-item-row:hover {
    background: rgba(0, 0, 0, 0.005);
  }

  .od-item-thumb {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
    border: 1.5px solid rgba(0, 0, 0, 0.08);
    background: #f8fafc;
    transition: transform 0.2s;
  }
  .od-item-row:hover .od-item-thumb {
    transform: scale(1.05);
    border-color: rgba(16, 185, 129, 0.3);
  }

  .od-item-info {
    flex: 1;
  }

  .od-item-name {
    font-weight: 600;
    font-size: 0.9rem;
    color: #0f172a;
    margin-bottom: 2px;
  }

  .od-item-sku {
    font-size: 0.75rem;
    color: #64748b;
  }

  .od-item-qty {
    font-size: 0.78rem;
    color: #475569;
    margin-top: 2px;
  }

  .od-item-price {
    text-align: right;
  }
  .od-item-price .unit {
    font-size: 0.75rem;
    color: #64748b;
  }
  .od-item-price .total {
    font-weight: 700;
    font-size: 0.9rem;
    color: #10b981;
  }

  /* ═══ Price breakdown list ════════════════════════════════════ */
  .od-price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 0.85rem;
    color: #475569;
    border-bottom: 1px solid rgba(0, 0, 0, 0.04);
  }
  .od-price-row:last-child { border-bottom: none; }
  
  .od-price-row.total {
    font-size: 0.95rem;
    font-weight: 700;
    color: #0f172a;
    padding-top: 10px;
    border-top: 1.5px dashed rgba(0, 0, 0, 0.08);
    border-bottom: none;
  }
  .od-price-row.total .amt {
    color: #059669;
    font-size: 1.25rem;
  }

  /* ═══ Stepper Timeline ════════════════════════════════════════ */
  .od-timeline {
    position: relative;
    padding-left: 28px;
  }
  .od-timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 12px;
    bottom: 12px;
    width: 2px;
    background: rgba(0, 0, 0, 0.06);
  }

  .od-timeline-step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 0;
    position: relative;
    z-index: 1;
  }
  
  .od-timeline-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    flex-shrink: 0;
    border: 2px solid rgba(0, 0, 0, 0.1);
    background: #ffffff;
    color: #64748b;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .od-timeline-dot.active {
    background: #10b981;
    border-color: #10b981;
    color: #ffffff;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
  }
  .od-timeline-dot.done {
    background: rgba(16, 185, 129, 0.08);
    border-color: #34d399;
    color: #059669;
  }
  .od-timeline-dot.cancelled {
    background: rgba(239, 68, 68, 0.08);
    border-color: #f87171;
    color: #b91c1c;
  }

  .od-timeline-text {
    padding-top: 2px;
  }
  .od-timeline-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #1f2937;
  }
  .od-timeline-sub {
    font-size: 0.72rem;
    color: #64748b;
    margin-top: 1px;
  }

  /* ═══ Customer Info Lists ═════════════════════════════════════ */
  .od-info-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .od-info-list li {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.03);
    font-size: 0.82rem;
  }
  .od-info-list li:last-child { border-bottom: none; }
  
  .od-info-label {
    color: #64748b;
    font-weight: 500;
  }
  .od-info-value {
    color: #334155;
    font-weight: 600;
    flex: 1;
    text-align: right;
  }

  /* ═══ Custom Scrollbars ═══════════════════════════════════════ */
  ::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.01);
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.1);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.2);
  }

  /* ═══ Buttons & Form Controls ════════════════════════════════ */
  .btn-print {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #ffffff;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
  }
  .btn-print:hover {
    filter: brightness(1.04);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
  }

  .od-form-group {
    margin-bottom: 12px;
  }
  .od-form-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .od-form-control {
    width: 100%;
    padding: 8px 12px;
    font-size: 0.82rem;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.12);
    color: #1e293b;
    outline: none;
    transition: all 0.2s;
    box-sizing: border-box;
  }
  .od-form-control:focus {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
  }

  .od-status-form {
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
  }

  .od-status-form select {
    flex: 1;
    padding: 8px 12px;
    font-size: 0.8rem;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.12);
    color: #1e293b;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  .od-status-form select:focus {
    border-color: #10b981;
  }

  .btn-dispatch {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 10px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 8px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    border: none;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    transition: all 0.2s;
  }
  .btn-dispatch:hover {
    filter: brightness(1.05);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
  }
  .btn-dispatch:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .tracking-preview-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    font-size: 0.78rem;
  }
  .tracking-preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    font-weight: 700;
    color: #475569;
  }
  .tracking-preview-link {
    color: #059669;
    word-break: break-all;
    text-decoration: none;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tracking-preview-link:hover {
    text-decoration: underline;
  }

  .btn-danger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(239, 68, 68, 0.06);
    border: 1.5px solid rgba(239, 68, 68, 0.2);
    color: #dc2626;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-danger:hover {
    background: #ef4444;
    color: white;
    border-color: #ef4444;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
  }
  .btn-danger svg {
    width: 12px;
    height: 12px;
  }

  /* Layout column allocations */
  .od-grid > div:first-child .od-card:first-child {
    flex: 1;
    min-height: 0;
    margin-bottom: 14px;
  }
  .od-grid > div:first-child .od-card:last-child {
    flex-shrink: 0;
  }
  .od-grid > div:last-child .od-card:first-child {
    flex: 1.4;
    min-height: 0;
    margin-bottom: 14px;
  }
  .od-grid > div:last-child .od-card:last-child {
    flex: 0.85;
    min-height: 0;
  }

  @media (max-width: 1440px) {
    .od-grid {
      grid-template-columns: minmax(0, 1fr) 580px;
      gap: 20px;
    }
  }

  @media (max-width: 1280px) {
    .od-grid {
      grid-template-columns: minmax(0, 1fr) 520px;
      gap: 16px;
    }
  }

  @media (max-width: 1024px) {
    body, html {
      overflow-y: auto !important;
      height: auto;
    }
    .order-detail-page {
      position: relative;
      height: auto;
      overflow: visible;
      min-height: 100vh;
    }
    .od-grid {
      grid-template-columns: 1fr;
      overflow: visible;
    }
    .od-grid > div {
      height: auto;
    }
    .od-card {
      margin-bottom: 16px;
    }
  }
</style>
