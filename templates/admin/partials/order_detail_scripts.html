<script>
  const ORDER_ID = {{ order.id }};
  const ORDER_NUMBER = '{{ order.order_number if order.order_number else '#' ~ order.id }}';

  const COURIER_URL_MAP = Object.assign({
    'delhivery': 'https://www.delhivery.com/track/package/{awb}',
    'bluedart': 'https://www.bluedart.com/tracking?track={awb}',
    'dtdc': 'https://www.dtdc.in/tracking/tracking_results.asp?Ttype=awb_no&strCnno={awb}',
    'indiapost': 'https://www.indiapost.gov.in/_layouts/15/dop.portal.tracking/trackconsignment.aspx',
    'xpressbees': 'https://www.xpressbees.com/track?isawb=Yes&trackid={awb}',
    'shadowfax': 'https://tracker.shadowfax.in/#/track?awb={awb}',
    'ekart': 'https://ekartlogistics.com/shipmenttrack/{awb}',
    'amazon': 'https://track.amazon.in/tracking/{awb}',
    'fedex': 'https://www.fedex.com/fedextrack/?trknbr={awb}',
    'dhl': 'https://www.dhl.com/in-en/home/tracking/tracking-express.html?submit=1&tracking-id={awb}',
    'shiprocket': 'https://shiprocket.co/tracking/{awb}',
    'shipglobal': 'https://shipglobal.in/tracking?awb={awb}',
    'cirro': 'https://www.cirrotrack.com/parcelTracking?id={awb}',
    'custom': 'https://shiprocket.co/tracking/{awb}'
  }, {{ courier_url_map | tojson if courier_url_map else '{}' }});

  function openCourierPanel(mode = 'add', courierData = null) {
    const box = document.getElementById('custom-courier-box');
    const titleEl = document.getElementById('custom-courier-box-title');
    const badgeEl = document.getElementById('courier-mode-badge');
    const modeInp = document.getElementById('custom-courier-mode');
    const idInp   = document.getElementById('custom-courier-id');
    const codeInp = document.getElementById('custom-courier-code');
    const nameInp = document.getElementById('custom-courier-name');
    const urlInp  = document.getElementById('custom-courier-url');
    const addActions = document.getElementById('courier-add-actions');
    const editActions = document.getElementById('courier-edit-actions');
    const courierSelect = document.getElementById('courier-select');

    if (!box) return;

    if (mode === 'edit' && courierData) {
      modeInp.value = 'edit';
      idInp.value = courierData.id || '';
      codeInp.value = courierData.code || '';
      if (nameInp) nameInp.value = courierData.name || '';
      if (urlInp) urlInp.value = courierData.url_pattern || '';

      titleEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit Courier: ${escapeHtml(courierData.name)}`;
      if (badgeEl) {
        badgeEl.style.display = 'inline-block';
        badgeEl.textContent = 'Edit Mode';
      }
      if (addActions) addActions.style.display = 'none';
      if (editActions) editActions.style.display = 'flex';
      box.style.display = 'block';
      box.style.background = '#eff6ff';
      box.style.borderColor = '#93c5fd';
      if (nameInp) setTimeout(() => nameInp.focus(), 50);
    } else {
      modeInp.value = 'add';
      idInp.value = '';
      codeInp.value = '';
      if (nameInp) nameInp.value = '';
      if (urlInp) urlInp.value = '';

      titleEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Add Custom Courier`;
      if (badgeEl) badgeEl.style.display = 'none';
      if (addActions) addActions.style.display = 'flex';
      if (editActions) editActions.style.display = 'none';
      box.style.display = 'block';
      box.style.background = '#f0fdf4';
      box.style.borderColor = '#86efac';

      if (courierSelect.value !== '__custom__' && courierSelect.value !== 'custom') {
        courierSelect.value = '__custom__';
      }
      if (nameInp) setTimeout(() => nameInp.focus(), 50);
    }

    updateTrackingPreview();
  }

  function closeCourierPanel() {
    const box = document.getElementById('custom-courier-box');
    const courierSelect = document.getElementById('courier-select');
    if (box) box.style.display = 'none';
    if (courierSelect.value === '__custom__') {
      courierSelect.value = '';
    }
    updateTrackingPreview();
  }

  function toggleCustomCourierPanel(show, clearFields = false) {
    if (show) {
      openCourierPanel('add');
    } else {
      closeCourierPanel();
    }
  }

  function editCurrentSelectedCourier() {
    const select = document.getElementById('courier-select');
    const opt = select.options[select.selectedIndex];
    if (!opt || !opt.value) return;

    openCourierPanel('edit', {
      id: opt.dataset.id || '',
      code: opt.value,
      name: opt.dataset.name || opt.textContent.replace('(Custom Partner)', '').replace('(Custom)', '').trim(),
      url_pattern: opt.dataset.url || '',
      sample_format: opt.dataset.format || ''
    });
  }

  function onCourierChange() {
    const courierSelect = document.getElementById('courier-select');
    const val           = courierSelect.value;
    const selectedOpt   = courierSelect.options[courierSelect.selectedIndex];
    const helpEl        = document.getElementById('awb-help');
    const editBtn       = document.getElementById('btn-edit-selected-courier');
    
    // Show edit button if it's a DB custom courier
    if (selectedOpt && selectedOpt.dataset.dbCustom === 'true') {
      if (editBtn) editBtn.style.display = 'inline-flex';
    } else {
      if (editBtn) editBtn.style.display = 'none';
    }

    if (val === '__custom__' || val === 'custom') {
      openCourierPanel('add');
      helpEl.textContent = 'Enter custom courier tracking number or reference ID';
    } else {
      const box = document.getElementById('custom-courier-box');
      if (box && document.getElementById('custom-courier-mode')?.value === 'add') {
        box.style.display = 'none';
      }

      if (selectedOpt && selectedOpt.dataset.format) {
        helpEl.textContent = selectedOpt.dataset.format;
      } else {
        helpEl.textContent = 'Enter courier tracking ID';
      }
    }
    updateTrackingPreview();
  }

  function onCustomCourierInput() {
    updateTrackingPreview();
  }

  function saveNewCourierDirectly() {
    const nameInput = document.getElementById('custom-courier-name');
    const urlInput  = document.getElementById('custom-courier-url');
    const name = nameInput ? nameInput.value.trim() : '';
    const urlPattern = urlInput ? urlInput.value.trim() : '';
    const btn = document.getElementById('btn-save-custom-courier');

    if (!name) {
      showToast('error', 'Please enter a courier name first.');
      if (nameInput) nameInput.focus();
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = 'Saving...';
    }

    fetch('/api/admin/couriers/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: name,
        url_pattern: urlPattern || '{awb}',
        sample_format: 'Enter tracking ID'
      })
    })
    .then(r => r.json())
    .then(data => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> <span>Save Partner</span>';
      }
      if (data.success && data.courier) {
        const c = data.courier;
        COURIER_URL_MAP[c.code] = c.url_pattern;
        COURIER_URL_MAP[c.name] = c.url_pattern;

        const select = document.getElementById('courier-select');
        let opt = Array.from(select.options).find(o => o.value.toLowerCase() === c.code.toLowerCase() || (c.id && o.dataset.id == c.id));
        if (!opt) {
          opt = document.createElement('option');
          opt.value = c.code;
          opt.dataset.id = c.id;
          opt.dataset.name = c.name;
          opt.textContent = `${c.name} (Custom Partner)`;
          opt.dataset.format = c.sample_format;
          opt.dataset.url = c.url_pattern;
          opt.dataset.dbCustom = 'true';
          opt.dataset.custom = 'true';
          const customOpt = select.querySelector('option[value="__custom__"]');
          if (customOpt) {
            select.insertBefore(opt, customOpt);
          } else {
            select.appendChild(opt);
          }
        } else {
          opt.dataset.id = c.id;
          opt.dataset.name = c.name;
          opt.dataset.url = c.url_pattern;
          opt.dataset.format = c.sample_format;
          opt.dataset.dbCustom = 'true';
          opt.textContent = `${c.name} (Custom Partner)`;
        }
        select.value = c.code;
        closeCourierPanel();
        onCourierChange();
        showToast('success', `Courier partner "${c.name}" saved!`);
      } else {
        showToast('error', data.error || 'Failed to save courier partner.');
      }
    })
    .catch(err => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> <span>Save Partner</span>';
      }
      showToast('error', 'Network error while saving courier partner.');
    });
  }

  function updateCourierDirectly() {
    const id = document.getElementById('custom-courier-id').value;
    const code = document.getElementById('custom-courier-code').value;
    const nameInput = document.getElementById('custom-courier-name');
    const urlInput  = document.getElementById('custom-courier-url');
    const name = nameInput ? nameInput.value.trim() : '';
    const urlPattern = urlInput ? urlInput.value.trim() : '';
    const btn = document.getElementById('btn-update-custom-courier');

    if (!name) {
      showToast('error', 'Courier name cannot be empty.');
      if (nameInput) nameInput.focus();
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = 'Updating...';
    }

    fetch('/api/admin/couriers/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: id || undefined,
        code: code || undefined,
        name: name,
        url_pattern: urlPattern || '{awb}',
        sample_format: 'Enter tracking ID'
      })
    })
    .then(r => r.json())
    .then(data => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> <span>Update Partner</span>';
      }
      if (data.success && data.courier) {
        const c = data.courier;
        COURIER_URL_MAP[c.code] = c.url_pattern;
        COURIER_URL_MAP[c.name] = c.url_pattern;

        const select = document.getElementById('courier-select');
        let opt = Array.from(select.options).find(o => (c.id && o.dataset.id == c.id) || o.value.toLowerCase() === (c.code || '').toLowerCase());
        if (opt) {
          opt.textContent = `${c.name} (Custom Partner)`;
          opt.dataset.name = c.name;
          opt.dataset.url = c.url_pattern;
          opt.dataset.format = c.sample_format;
          opt.dataset.dbCustom = 'true';
        }
        closeCourierPanel();
        updateTrackingPreview();
        showToast('success', `Courier partner "${c.name}" updated successfully!`);
      } else {
        showToast('error', data.error || 'Failed to update courier partner.');
      }
    })
    .catch(() => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> <span>Update Partner</span>';
      }
      showToast('error', 'Network error while updating courier.');
    });
  }

  function deleteSelectedCourierDirectly() {
    const id = document.getElementById('custom-courier-id').value;
    const code = document.getElementById('custom-courier-code').value;
    const name = document.getElementById('custom-courier-name').value;

    if (!confirm(`Are you sure you want to delete the courier partner "${name}"?`)) {
      return;
    }

    const btn = document.getElementById('btn-delete-custom-courier');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Deleting...';
    }

    fetch('/api/admin/couriers/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id || undefined, code: code || undefined })
    })
    .then(r => r.json())
    .then(data => {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Delete';
      }
      if (data.success) {
        const select = document.getElementById('courier-select');
        const opt = Array.from(select.options).find(o => (id && o.dataset.id == id) || (code && o.value === code));
        if (opt) opt.remove();
        if (code) delete COURIER_URL_MAP[code];
        if (name) delete COURIER_URL_MAP[name];

        select.value = '';
        closeCourierPanel();
        onCourierChange();
        showToast('success', `Courier partner "${name}" removed.`);
      } else {
        showToast('error', data.error || 'Failed to delete courier.');
      }
    })
    .catch(() => {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Delete';
      }
      showToast('error', 'Network error while deleting courier.');
    });
  }

  // Manage Couriers Directory Modal
  function openManageCouriersModal() {
    const modal = document.getElementById('manage-couriers-modal');
    if (modal) {
      modal.style.display = 'flex';
      loadCustomCouriersList();
    }
  }

  function closeManageCouriersModal() {
    const modal = document.getElementById('manage-couriers-modal');
    if (modal) modal.style.display = 'none';
  }

  function openCourierPanelFromModal(mode, courier = null) {
    closeManageCouriersModal();
    if (mode === 'edit' && courier) {
      const select = document.getElementById('courier-select');
      if (select) select.value = courier.code;
      openCourierPanel('edit', courier);
    } else {
      openCourierPanel('add');
    }
  }

  function loadCustomCouriersList() {
    const loading = document.getElementById('modal-couriers-loading');
    const empty   = document.getElementById('modal-couriers-empty');
    const list    = document.getElementById('modal-couriers-list');

    if (loading) loading.style.display = 'block';
    if (empty)   empty.style.display = 'none';
    if (list)    list.style.display = 'none';

    fetch('/api/admin/couriers/list')
      .then(r => r.json())
      .then(data => {
        if (loading) loading.style.display = 'none';
        if (data.success && data.couriers && data.couriers.length > 0) {
          list.innerHTML = '';
          data.couriers.forEach(c => {
            const item = document.createElement('div');
            item.style.cssText = 'background:#ffffff; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; box-shadow:0 1px 2px rgba(0,0,0,0.03);';
            item.innerHTML = `
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                  <span style="font-weight:700; font-size:0.88rem; color:#0f172a;">${escapeHtml(c.name)}</span>
                  <span style="background:#ecfdf5; color:#059669; font-size:0.68rem; font-weight:700; padding:2px 6px; border-radius:4px;">${escapeHtml(c.code)}</span>
                </div>
                <div style="font-size:0.75rem; color:#64748b; font-family:monospace; word-break:break-all;">
                  ${escapeHtml(c.url_pattern || '{awb}')}
                </div>
              </div>
              <div style="display:inline-flex; align-items:center; gap:6px; flex-shrink:0;">
                <button type="button" class="btn-modal-edit" style="background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; padding:5px 10px; border-radius:6px; font-size:0.75rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:4px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Edit
                </button>
                <button type="button" class="btn-modal-delete" style="background:#fef2f2; color:#dc2626; border:1px solid #fecaca; padding:5px 8px; border-radius:6px; font-size:0.75rem; font-weight:700; cursor:pointer;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            `;
            item.querySelector('.btn-modal-edit').onclick = () => openCourierPanelFromModal('edit', c);
            item.querySelector('.btn-modal-delete').onclick = () => deleteCourierFromModal(c.id, c.code, c.name);
            list.appendChild(item);
          });
          list.style.display = 'flex';
        } else {
          if (empty) empty.style.display = 'block';
        }
      })
      .catch(() => {
        if (loading) loading.style.display = 'none';
        if (empty) {
          empty.style.display = 'block';
          empty.innerHTML = '<p style="color:#ef4444; font-size:0.85rem;">Failed to load couriers directory.</p>';
        }
      });
  }

  function deleteCourierFromModal(id, code, name) {
    if (!confirm(`Delete custom courier partner "${name}"?`)) return;

    fetch('/api/admin/couriers/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, code })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        const select = document.getElementById('courier-select');
        const opt = Array.from(select.options).find(o => (id && o.dataset.id == id) || (code && o.value === code));
        if (opt) opt.remove();
        if (code) delete COURIER_URL_MAP[code];
        if (name) delete COURIER_URL_MAP[name];
        loadCustomCouriersList();
        showToast('success', `Deleted "${name}".`);
      } else {
        showToast('error', data.error || 'Failed to delete courier.');
      }
    })
    .catch(() => {
      showToast('error', 'Network error deleting courier.');
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  let awbLookupDebounce = null;
  let lastLookupAwb = '';

  function onAwbInput(val) {
    const awb = (val || '').trim();
    const linkInput = document.getElementById('courier-link-input');
    const eddInput  = document.getElementById('edd-input');
    const partnerBadge = document.getElementById('courier-partner-badge');
    const awbHelp = document.getElementById('awb-help');

    // If admin clears the AWB, reset auto-detected details
    if (!awb) {
      if (partnerBadge) partnerBadge.style.display = 'none';
      if (linkInput && linkInput.value.includes('shiprocket.co/tracking/')) {
        linkInput.value = '';
      }
      if (awbHelp) awbHelp.textContent = 'Enter courier tracking ID';
      const pulseDot = document.getElementById('live-pulse-dot');
      const pulseStatus = document.getElementById('live-pulse-status');
      if (pulseDot) {
        pulseDot.style.background = '#cbd5e1';
        pulseDot.style.boxShadow = 'none';
      }
      if (pulseStatus) {
        pulseStatus.style.color = '#64748b';
        pulseStatus.textContent = 'Awaiting AWB Assignment';
      }
      updateTrackingPreview();
      return;
    }

    // Auto-detect carrier and update tracking link
    const cleanUpperAwb = awb.toUpperCase();
    const courierSelect = document.getElementById('courier-select');

    if (cleanUpperAwb.startsWith('GFUS') || cleanUpperAwb.startsWith('CIRRO')) {
      if (courierSelect) {
        for (let i = 0; i < courierSelect.options.length; i++) {
          const val = courierSelect.options[i].value.toLowerCase();
          if (val === 'cirro' || val.includes('cirro') || val === 'shipglobal') {
            courierSelect.selectedIndex = i;
            break;
          }
        }
      }
      if (linkInput) {
        linkInput.value = `https://www.cirrotrack.com/parcelTracking?id=${encodeURIComponent(awb)}`;
      }
    } else if (cleanUpperAwb.startsWith('UUS') || cleanUpperAwb.startsWith('SG')) {
      if (courierSelect) {
        for (let i = 0; i < courierSelect.options.length; i++) {
          if (courierSelect.options[i].value.toLowerCase() === 'shipglobal') {
            courierSelect.selectedIndex = i;
            break;
          }
        }
      }
      if (linkInput) {
        linkInput.value = `https://shipglobal.in/tracking?awb=${encodeURIComponent(awb)}`;
      }
    } else if (linkInput) {
      if (!linkInput.value || linkInput.value.includes('shiprocket.co/tracking/')) {
        linkInput.value = `https://shiprocket.co/tracking/${encodeURIComponent(awb)}`;
      }
    }
    updateTrackingPreview();

    const statusSelect = document.getElementById('status-select');
    if (statusSelect && (statusSelect.value === 'Order Confirmed' || statusSelect.value === 'Processing' || statusSelect.value === 'Placed')) {
      statusSelect.value = 'Shipped';
      updateTimelineUI('Shipped');
    }
    const cancelBtn = document.getElementById('btn-cancel-order');
    if (cancelBtn) cancelBtn.style.display = 'none';
    const cancelOpt = document.getElementById('opt-status-cancelled');
    if (cancelOpt) {
      cancelOpt.disabled = true;
      cancelOpt.style.display = 'none';
    }
    const pulseDot = document.getElementById('live-pulse-dot');
    const pulseStatus = document.getElementById('live-pulse-status');
    if (pulseDot) {
      pulseDot.style.background = '#10b981';
      pulseDot.style.boxShadow = '0 0 0 2px rgba(16,185,129,0.25)';
    }
    if (pulseStatus) {
      pulseStatus.style.color = '#059669';
      pulseStatus.textContent = 'Active (Real-time)';
    }

    // Automatically query courier API to fetch updated partner info whenever AWB changes
    if (awbLookupDebounce) clearTimeout(awbLookupDebounce);
    if (awb.length >= 6 && awb !== lastLookupAwb) {
      if (awbHelp) {
        awbHelp.innerHTML = `<span style="color:#0284c7; font-weight:600;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11" style="animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> Fetching updated courier partner info from API...</span>`;
      }
      awbLookupDebounce = setTimeout(() => {
        fetchCourierInfoByAwb(awb);
      }, 450);
    }
  }

  function fetchCourierInfoByAwb(awb) {
    if (!awb || awb.length < 5) return;
    lastLookupAwb = awb;
    const fetchBtn = document.getElementById('btn-fetch-awb');
    const originalBtnHtml = fetchBtn ? fetchBtn.innerHTML : '';
    if (fetchBtn) {
      fetchBtn.disabled = true;
      fetchBtn.innerHTML = `<span>Updating...</span>`;
    }

    fetch(`/api/admin/couriers/lookup-awb?awb=${encodeURIComponent(awb)}`)
      .then(r => r.json())
      .then(data => {
        if (fetchBtn) {
          fetchBtn.disabled = false;
          fetchBtn.innerHTML = originalBtnHtml;
        }
        if (data.success && data.courier_name) {
          // 1. Visibly show and select the NEW courier partner in the Choose Courier box
          const courierSelect = document.getElementById('courier-select');
          if (courierSelect) {
            const targetCode = (data.courier_code || '').toLowerCase().trim();
            const targetName = (data.courier_name || '').toLowerCase().trim();
            let matched = false;

            for (let i = 0; i < courierSelect.options.length; i++) {
              const opt = courierSelect.options[i];
              if (!opt.value || opt.value === '__custom__') continue;
              const optVal = (opt.value || '').toLowerCase().trim();
              const optName = (opt.dataset.name || opt.text || '').toLowerCase().trim();
              if (
                (targetCode && optVal === targetCode) ||
                (targetName && optName === targetName) ||
                (targetName && optVal === targetName) ||
                (targetCode && optName.includes(targetCode)) ||
                (targetName && (optName.includes(targetName) || targetName.includes(optName)))
              ) {
                courierSelect.selectedIndex = i;
                matched = true;
                break;
              }
            }

            if (!matched) {
              // Add option directly into the Choose Courier box so the fetched name is visibly shown
              const newOpt = document.createElement('option');
              newOpt.value = data.courier_name;
              newOpt.dataset.name = data.courier_name;
              newOpt.dataset.url = data.tracking_url || `https://shiprocket.co/tracking/${encodeURIComponent(awb)}`;
              newOpt.text = data.courier_name;
              const customOpt = courierSelect.querySelector('option[value="__custom__"]');
              if (customOpt) {
                courierSelect.insertBefore(newOpt, customOpt);
              } else {
                courierSelect.appendChild(newOpt);
              }
              newOpt.selected = true;
              courierSelect.value = newOpt.value;
            }

            // Close custom courier box if open
            const customBox = document.getElementById('custom-courier-box');
            if (customBox) customBox.style.display = 'none';

            // Visually highlight the choose courier box so admin clearly sees the updated partner
            courierSelect.style.transition = 'all 0.3s ease';
            courierSelect.style.borderColor = '#10b981';
            courierSelect.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.25)';
            setTimeout(() => {
              courierSelect.style.borderColor = '';
              courierSelect.style.boxShadow = '';
            }, 2200);

            // Update badge next to Choose Courier box label
            const partnerBadge = document.getElementById('courier-partner-badge');
            if (partnerBadge) {
              partnerBadge.textContent = `✓ ${data.courier_name}`;
              partnerBadge.style.display = 'inline-block';
            }

            // Trigger courier change handler to refresh helper format & preview
            onCourierChange();
          }

          // 2. Update EDD to new courier's estimated delivery date
          const eddInput = document.getElementById('edd-input');
          if (eddInput) {
            eddInput.value = data.edd || '';
          }

          // 3. Update tracking link to new AWB's tracking link
          const defaultShiprocketUrl = `https://shiprocket.co/tracking/${encodeURIComponent(awb)}`;
          const linkInput = document.getElementById('courier-link-input');
          if (linkInput) {
            linkInput.value = data.tracking_url || defaultShiprocketUrl;
          }

          // 4. Update live tracking preview block
          updateTrackingPreview();

          const awbHelp = document.getElementById('awb-help');
          if (awbHelp) {
            awbHelp.innerHTML = `<span style="color:#059669; font-weight:700;">✓ Updated Partner: ${escapeHtml(data.courier_name)}</span>`;

      })
      .catch(() => {
        if (fetchBtn) {

          fetchBtn.innerHTML = originalBtnHtml;
        }
      });
  }

  function onCourierLinkInput(urlStr) {
    if (!urlStr) return;
    const url = urlStr.trim();
    if (!url) return;

    const lowerUrl = url.toLowerCase();
    const courierSelect = document.getElementById('courier-select');
    const awbInput = document.getElementById('awb-input');

    // Courier domain matchers
    const matchers = [
      { key: 'delhivery', pattern: /delhivery/i },
      { key: 'bluedart', pattern: /bluedart/i },
      { key: 'dtdc', pattern: /dtdc/i },
      { key: 'shipglobal', pattern: /(shipglobal|labels\.shipglobal)/i },
      { key: 'shiprocket', pattern: /shiprocket/i },
      { key: 'indiapost', pattern: /(indiapost|speedpost)/i },
      { key: 'xpressbees', pattern: /xpressbees/i },
      { key: 'shadowfax', pattern: /shadowfax/i },
      { key: 'ekart', pattern: /ekart/i },
      { key: 'amazon', pattern: /amazon/i },
      { key: 'fedex', pattern: /fedex/i },
      { key: 'dhl', pattern: /dhl/i },
      { key: 'trackon', pattern: /trackon/i },
      { key: 'ecomexpress', pattern: /ecomexpress/i },
      { key: 'smartr', pattern: /smartr/i }
    ];

    let detectedCourier = '';
    for (const m of matchers) {
      if (m.pattern.test(lowerUrl)) {
        detectedCourier = m.key;
        break;
      }
    }

    if (detectedCourier && courierSelect) {
      // Find matching option
      let found = false;
      for (let i = 0; i < courierSelect.options.length; i++) {
        if (courierSelect.options[i].value.toLowerCase() === detectedCourier) {
          courierSelect.selectedIndex = i;
          found = true;
          break;
        }
      }
      if (!found) {
        // Match custom courier or add
        const customName = detectedCourier.charAt(0).toUpperCase() + detectedCourier.slice(1);
        const nameInp = document.getElementById('custom-courier-name');
        if (nameInp) nameInp.value = customName;
      }
    }

    // Try extracting AWB number embedded in URL
    const awbMatches = [
      /[?&](?:awb|trackid|tracking_no|tracking_number|waybill|cnno|consignment|num|id)=([A-Za-z0-9_-]{6,32})/i,
      /\/(?:track|tracking|shipment|package|awb)\/([A-Za-z0-9_-]{6,32})/i,
      /\/([0-9]{8,18})(?:[/?#]|$)/
    ];

    if (awbInput && !awbInput.value.trim()) {
      for (const rx of awbMatches) {
        const m = url.match(rx);
        if (m && m[1]) {
          awbInput.value = m[1];
          break;
        }
      }
    }

    // Auto-advance to Shipped
    const statusSelect = document.getElementById('status-select');
    if (statusSelect && (statusSelect.value === 'Order Confirmed' || statusSelect.value === 'Processing' || statusSelect.value === 'Placed')) {
      statusSelect.value = 'Shipped';
      updateTimelineUI('Shipped');
    }
    const cancelBtn = document.getElementById('btn-cancel-order');
    if (cancelBtn) cancelBtn.style.display = 'none';
    const cancelOpt = document.getElementById('opt-status-cancelled');
    if (cancelOpt) {
      cancelOpt.disabled = true;
      cancelOpt.style.display = 'none';
    }

    updateTrackingPreview();
  }

  function updateTrackingPreview() {
    const courierSelect = document.getElementById('courier-select');
    const courierCode   = courierSelect ? courierSelect.value || 'custom' : 'custom';
    const selectedOpt   = courierSelect ? courierSelect.options[courierSelect.selectedIndex] : null;
    const awbInput      = document.getElementById('awb-input');
    const awb           = awbInput ? awbInput.value.trim() : '';
    const linkInput     = document.getElementById('courier-link-input');
    const directLink    = linkInput ? linkInput.value.trim() : '';
    const previewBlock  = document.getElementById('tracking-preview-block');
    const previewName   = document.getElementById('preview-courier-name');
    const previewLink   = document.getElementById('preview-url-link');
    const previewText   = document.getElementById('preview-url-text');
    const customNameInp = document.getElementById('custom-courier-name');
    const customUrlInp  = document.getElementById('custom-courier-url');

    if (!awb && !directLink) {
      if (previewBlock) previewBlock.style.display = 'none';
      return;
    }

    let courierDisplayName = '';
    let targetUrl = '';

    if (directLink) {
      targetUrl = directLink;
      courierDisplayName = (selectedOpt && selectedOpt.dataset.name) ? selectedOpt.dataset.name : (selectedOpt ? selectedOpt.text.replace('(Custom Partner)', '').replace('(Custom)', '').trim() : 'Live Courier Webpage');
    } else if (courierCode === '__custom__' || courierCode === 'custom') {
      courierDisplayName = (customNameInp && customNameInp.value.trim()) ? customNameInp.value.trim() : 'Custom Courier';
      const customUrlPat = (customUrlInp && customUrlInp.value.trim()) ? customUrlInp.value.trim() : '';
      if (customUrlPat) {
        if (customUrlPat.includes('{awb}') || customUrlPat.includes('{tracking_number}')) {
          targetUrl = customUrlPat.replace('{awb}', encodeURIComponent(awb)).replace('{tracking_number}', encodeURIComponent(awb));
        } else if (customUrlPat.startsWith('http://') || customUrlPat.startsWith('https://')) {
          targetUrl = customUrlPat;
        } else {
          targetUrl = 'https://' + customUrlPat;
        }
      } else {
        targetUrl = awb.startsWith('http') ? awb : `Track via ${courierDisplayName}`;
      }
    } else {
      courierDisplayName = (selectedOpt && selectedOpt.dataset.name) ? selectedOpt.dataset.name : (selectedOpt ? selectedOpt.text.replace('(Custom Partner)', '').replace('(Custom)', '').trim() : courierCode);
      const pattern = (selectedOpt && selectedOpt.dataset.url) || COURIER_URL_MAP[courierCode] || COURIER_URL_MAP['custom'] || '{awb}';
      if (pattern.includes('{awb}') || pattern.includes('{tracking_number}')) {
        targetUrl = pattern.replace('{awb}', encodeURIComponent(awb)).replace('{tracking_number}', encodeURIComponent(awb));
      } else {
        targetUrl = pattern;
      }
    }

    if (previewName) previewName.textContent = courierDisplayName;
    if (previewBlock) previewBlock.style.display = 'block';
    if (previewLink) previewLink.href = (targetUrl.startsWith('http://') || targetUrl.startsWith('https://')) ? targetUrl : '#';
    if (previewText) previewText.textContent = targetUrl;

    // Auto-promote status to Shipped if currently at initial stage
    const statusSelect = document.getElementById('status-select');
    if (statusSelect && (statusSelect.value === 'Order Confirmed' || statusSelect.value === 'Processing' || statusSelect.value === 'Placed')) {
      statusSelect.value = 'Shipped';
    }
  }

  function updateTimelineUI(status) {
    const badge = document.getElementById('live-status-badge');
    if (badge) {
      const cleanClass = status.toLowerCase().replace(/\s+/g, '-');
      badge.className = `od-status-badge ${cleanClass}`;
      badge.innerHTML = `<span class="dot"></span>${status}`;
    }

    const cancelBtn = document.getElementById('btn-cancel-order');
    const cancelOpt = document.getElementById('opt-status-cancelled');
    if (['Shipped', 'In Transit', 'Delivered'].includes(status)) {
      if (cancelBtn) cancelBtn.style.display = 'none';
      if (cancelOpt) {
        cancelOpt.disabled = true;
        cancelOpt.style.display = 'none';
      }
    } else if (status !== 'Cancelled') {
      if (cancelBtn) cancelBtn.style.display = 'inline-flex';
      if (cancelOpt) {
        cancelOpt.disabled = false;
        cancelOpt.style.display = '';
      }
    }

    const timeline = document.getElementById('timeline-container');
    if (!timeline) return;

    if (status === 'Cancelled') {
      timeline.innerHTML = `
        <div class="od-timeline-step" data-step-label="Cancelled">
          <div class="od-timeline-dot cancelled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          <div class="od-timeline-text">
            <div class="od-timeline-title">Cancelled</div>
            <div class="od-timeline-sub">Order was cancelled</div>
          </div>
        </div>
      `;
      return;
    }

    const steps = ['Order Confirmed', 'Shipped', 'In Transit', 'Delivered'];
    let currentIdx = steps.indexOf(status);
    if (currentIdx === -1 && status === 'Processing') currentIdx = 0;
    
    let html = '';
    steps.forEach((label, idx) => {
      let dotContent = '';
      let dotClass = '';
      let opacityStyle = '';
      let subText = '';
      
      if (idx < currentIdx || (idx === currentIdx && status === 'Delivered')) {
        dotClass = 'done';
        dotContent = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="20 6 9 17 4 12"/></svg>';
        subText = 'Completed';
      } else if (idx === currentIdx) {
        dotClass = 'active';
        dotContent = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><circle cx="12" cy="12" r="3"/></svg>';
        subText = 'In progress';
      } else {
        dotContent = `<span style="color:#64748b; font-size:0.65rem; font-weight:700;">${idx + 1}</span>`;
        opacityStyle = 'opacity:0.4;';
        subText = 'Pending';
      }
      
      html += `
        <div class="od-timeline-step" data-step-label="${label}" data-step-index="${idx}">
          <div class="od-timeline-dot ${dotClass}">
            ${dotContent}
          </div>
          <div class="od-timeline-text">
            <div class="od-timeline-title" style="${opacityStyle}">${label}</div>
            <div class="od-timeline-sub">${subText}</div>
          </div>
        </div>
      `;
    });
    timeline.innerHTML = html;
  }

  function saveTrackingAndStatus(e) {
    e.preventDefault();
    const btn = document.getElementById('dispatch-btn');
    const status = document.getElementById('status-select').value;
    const courier_partner = document.getElementById('courier-select').value;
    const tracking_number = document.getElementById('awb-input').value.trim();
    const direct_link     = document.getElementById('courier-link-input')?.value.trim() || '';
    const estimated_delivery_date = document.getElementById('edd-input').value;

    const customNameInp = document.getElementById('custom-courier-name');
    const customUrlInp  = document.getElementById('custom-courier-url');
    const savePermanentInp = document.getElementById('save-courier-permanently');

    const custom_courier_name = customNameInp ? customNameInp.value.trim() : '';
    const tracking_url = direct_link || (customUrlInp ? customUrlInp.value.trim() : '');
    const save_courier_permanently = savePermanentInp ? savePermanentInp.checked : false;

    btn.disabled = true;
    btn.innerHTML = 'Saving &amp; Updating…';

    fetch(`/admin/update-order-status/${ORDER_ID}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        status,
        courier_partner,
        custom_courier_name,
        tracking_number,
        tracking_url,
        courier_link: direct_link,
        estimated_delivery_date,
        save_courier_permanently
      })
    })
    .then(r => r.json())
    .then(data => {
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg> Update &amp; Dispatch Order`;
      if (data.success) {
        const newStatus = data.status || status;
        const statusSelect = document.getElementById('status-select');
        if (statusSelect) statusSelect.value = newStatus;
        updateTimelineUI(newStatus);
        if (data.courier_name) {
          const previewName = document.getElementById('preview-courier-name');
          if (previewName) previewName.textContent = data.courier_name;
        }
        if (newStatus === 'Cancelled' && (data.refund_id || data.refund_status)) {
          renderRefundCard(data, 'Cancelled');
        } else {
          renderRefundCard(null, newStatus);
        }
        updateTrackingPreview();
        startLiveCourierAutoSync();
        showToast('success', `Order ${ORDER_NUMBER} updated successfully (Status: ${newStatus})`);
      } else {
        showToast('error', data.error || 'Update failed');
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg> Update &amp; Dispatch Order`;
      showToast('error', 'Network error. Please try again.');
    });
  }

  function cancelOrder() {
    const currentStatus = document.getElementById('status-select')?.value || '';
    if (['Shipped', 'In Transit', 'Delivered'].includes(currentStatus)) {
      showToast('error', 'Order cannot be cancelled once it has been shipped.');
      return;
    }
    if (!confirm(`Are you sure you want to cancel Order ${ORDER_NUMBER}? This cannot be undone.`)) return;
    document.getElementById('status-select').value = 'Cancelled';
    
    fetch(`/admin/update-order-status/${ORDER_ID}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'Cancelled' })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        updateTimelineUI('Cancelled');
        const refundObj = {
          refund_id: data.refund_id,
          refund_status: data.refund_status,
          refund_amount: {{ order.total_amount }},
          is_cod: data.is_cod,
          payment_method: '{{ order.payment_method or "" }}'
        };

        if (livePollingInterval) clearInterval(livePollingInterval);
        showToast('success', `Order ${ORDER_NUMBER} has been cancelled.`);
      } else {
        showToast('error', data.error || 'Cancel failed');
      }
    })
    .catch(() => showToast('error', 'Network error.'));
  }

  // ── Shiprocket Live Tracking Synchronization ───────────────────────────
  function syncShiprocketTracking() {
    const btn = document.getElementById('btn-sync-shiprocket');
    const originalText = btn ? btn.innerHTML : '';

    if (btn) {
      btn.disabled = true;
      btn.style.opacity = '0.7';
      btn.innerHTML = `
        <svg class="spin-animation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13" style="animation: spin 0.8s linear infinite;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>Syncing...</span>
      `;
    }

    fetch(`/admin/orders/${ORDER_ID}/sync-tracking`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(r => r.json())
    .then(data => {
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerHTML = originalText;
      }

      if (data.success) {
        const targetStatus = data.new_status || data.status;
        // Update status dropdown and visual timeline
        if (targetStatus) {
          const statusSelect = document.getElementById('status-select');
          if (statusSelect) statusSelect.value = targetStatus;
          updateTimelineUI(targetStatus);
        }

        renderRefundCard(data.refund_info || data, targetStatus);

        // Update current courier status headline
        const statusText = document.getElementById('shiprocket-current-status-text');
        if (statusText) {
          statusText.textContent = data.raw_courier_status || targetStatus || 'In Transit';
        }

        // Update timestamp
        const timeEl = document.getElementById('sync-last-timestamp');
        if (timeEl) {
          timeEl.textContent = `Synced: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }

        // Update scans list
        const scansList = document.getElementById('shiprocket-scans-list');
        const lt = data.live_tracking;
        if (scansList && lt && lt.shipment_track_activities && lt.shipment_track_activities.length > 0) {
          let html = '';
          lt.shipment_track_activities.forEach((act, idx) => {
            const isLatest = idx === 0;
            const dotColor = isLatest ? '#0284c7' : '#94a3b8';
            html += `
              <div style="position:relative;">
                <div style="position:absolute; left:-21px; top:4px; width:10px; height:10px; border-radius:50%; background:${dotColor}; border:2px solid #ffffff;"></div>
                <div style="font-size:0.8rem; font-weight:700; color:#1e293b;">
                  ${escapeHtml(act.activity || act.status || 'In Transit')}
                </div>
                <div style="font-size:0.7rem; color:#64748b; margin-top:1px;">
                  ${escapeHtml(act.location || 'Courier Hub')} • ${escapeHtml(act.date || act.time || '')}
                </div>
              </div>
            `;
          });
          scansList.innerHTML = html;
        }

        const msg = data.changed ? `Status advanced to "${targetStatus}"!` : 'Courier tracking is up-to-date.';
        showToast('success', msg);
      } else {
        showToast('error', data.error || 'Failed to sync with courier service.');
      }
    })
    .catch(err => {
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerHTML = originalText;
      }
      showToast('error', 'Network error while syncing courier tracking.');
    });
  }

  // ── Real-Time Live Courier Polling System ────────────────────────────────
  let livePollingInterval = null;
  function startLiveCourierAutoSync() {
    if (livePollingInterval) clearInterval(livePollingInterval);
    const statusSelect = document.getElementById('status-select');
    const awbInput     = document.getElementById('awb-input');
    const curStatus    = statusSelect ? statusSelect.value : '';
    const hasAwb       = awbInput && awbInput.value.trim().length > 0;

    if (!hasAwb || curStatus === 'Delivered' || curStatus === 'Cancelled') {
      return;
    }

    livePollingInterval = setInterval(() => {
      fetch(`/api/admin/orders/${ORDER_ID}/live-tracking-status?force=0`)
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            const currentStatus = data.status || data.new_status;
            if (currentStatus && statusSelect && statusSelect.value !== currentStatus) {
              statusSelect.value = currentStatus;
              updateTimelineUI(currentStatus);
              showToast('success', `Live Courier Update: ${currentStatus}`);
            }

            renderRefundCard(data.refund_info || data, currentStatus);

            if (data.raw_courier_status) {
              const statusText = document.getElementById('shiprocket-current-status-text');
              if (statusText) statusText.textContent = data.raw_courier_status;
            }

            const timeEl = document.getElementById('sync-last-timestamp');
            if (timeEl) {
              timeEl.textContent = `Live: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
            }

            if (currentStatus === 'Delivered' || currentStatus === 'Cancelled') {
              clearInterval(livePollingInterval);
            }
          }
        })
        .catch(() => {});
    }, 4000); // 4-second pulse
  }

  // Restore Orders tab when returning to dashboard
  if (window.performance && window.performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
    sessionStorage.setItem('adminTab', 'orders');
  }

  // Initialize tracking preview and live polling on load
  document.addEventListener('DOMContentLoaded', () => {
    onCourierChange();
    updateTrackingPreview();
    startLiveCourierAutoSync();
    document.getElementById('status-select')?.addEventListener('change', function() {
      updateTimelineUI(this.value);
    });
  });
</script>
