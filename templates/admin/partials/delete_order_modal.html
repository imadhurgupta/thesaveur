<!-- =======================================================================
     PERMANENT ORDER DELETION MODAL (DIRECT ADMIN CONFIRMATION)
======================================================================== -->
<div id="delete-order-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.65); backdrop-filter:blur(4px); z-index:99999; align-items:center; justify-content:center;">
  <div class="modal-card" style="background:#ffffff; width:100%; max-width:460px; border-radius:16px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); border:1px solid #fecaca; overflow:hidden; animation:modalSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);">
    
    <!-- Modal Header -->
    <div style="background:#fff1f2; padding:20px 24px; border-bottom:1px solid #ffe4e6; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:42px; height:42px; border-radius:12px; background:#fee2e2; color:#e11d48; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="22" height="22" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        </div>
        <div>
          <h3 style="font-size:1.15rem; font-weight:800; color:#9f1239; margin:0 0 3px 0;">Delete Order</h3>
          <p style="font-size:0.78rem; color:#be123c; margin:0; font-weight:500;">Permanent deletion &bull; Cannot be undone</p>
        </div>
      </div>
      <button type="button" onclick="closeDeleteOrderModal()" style="background:none; border:none; color:#9f1239; cursor:pointer; padding:4px; border-radius:6px; display:flex;" title="Close Modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div style="padding:24px;">
      <!-- Order Target Summary Card -->
      <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px 16px; margin-bottom:18px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:0.75rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.05em;">Order To Delete</span>
          <span id="del-modal-order-badge" style="font-size:0.75rem; font-weight:700; color:#e11d48; background:#fff1f2; padding:2px 8px; border-radius:99px; border:1px solid #fecdd3;">Irreversible</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div>
            <strong id="del-modal-order-number" style="font-size:1.1rem; color:#0f172a; font-weight:800;">#TSV-XXXXXX</strong>
            <div id="del-modal-customer" style="font-size:0.8rem; color:#64748b; margin-top:2px;">Customer: Loading...</div>
          </div>
          <div style="text-align:right;">
            <div id="del-modal-amount" style="font-size:1.1rem; font-weight:800; color:#0f172a;">$0.00</div>
          </div>
        </div>
      </div>

      <!-- Warning Note -->
      <p style="font-size:0.84rem; color:#475569; line-height:1.5; margin:0 0 20px 0;">
        Are you sure you want to permanently delete this order? All associated records, ordered items, and tracking details will be permanently purged from the database.
      </p>

      <!-- Action Buttons -->
      <div style="display:flex; gap:12px; justify-content:flex-end;">
        <button type="button" onclick="closeDeleteOrderModal()" style="flex:1; background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; padding:12px 18px; border-radius:10px; font-weight:700; font-size:0.88rem; cursor:pointer; transition:all 0.2s;">
          Cancel
        </button>
        <button type="button" id="btn-confirm-delete-order" onclick="confirmOrderDelete()" style="flex:1.4; background:linear-gradient(135deg, #e11d48 0%, #be123c 100%); color:#ffffff; border:none; padding:12px 20px; border-radius:10px; font-weight:800; font-size:0.88rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 12px rgba(225,29,72,0.3); transition:all 0.2s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          Delete Permanently
        </button>
      </div>

      <!-- Action Status Alert -->
      <div id="del-modal-status-alert" style="display:none; margin-top:14px; padding:10px 14px; border-radius:8px; font-size:0.8rem; font-weight:600;"></div>
    </div>

  </div>
</div>

<style>
@keyframes modalSlideIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
</style>

<script>
// ── Global State for Permanent Order Deletion ──────────────────────────────
let currentDeleteOrderRef = '';

function openDeleteOrderModal(orderRef, orderNumber, customerName, totalAmount) {
  currentDeleteOrderRef = orderRef;
  
  const modal = document.getElementById('delete-order-modal');
  const numEl = document.getElementById('del-modal-order-number');
  const custEl = document.getElementById('del-modal-customer');
  const amtEl = document.getElementById('del-modal-amount');
  const alertEl = document.getElementById('del-modal-status-alert');
  const btn = document.getElementById('btn-confirm-delete-order');

  if (numEl) numEl.textContent = orderNumber || ('#' + orderRef);
  if (custEl) custEl.textContent = customerName ? ('Customer: ' + customerName) : '';
  if (amtEl) amtEl.textContent = totalAmount ? (totalAmount.startsWith('$') ? totalAmount : ('$' + totalAmount)) : '';
  if (alertEl) alertEl.style.display = 'none';

  if (btn) {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Delete Permanently`;
  }

  if (modal) {
    modal.style.display = 'flex';
  }
}

function closeDeleteOrderModal() {
  const modal = document.getElementById('delete-order-modal');
  if (modal) modal.style.display = 'none';
}

function showDelModalAlert(type, message) {
  const alertEl = document.getElementById('del-modal-status-alert');
  if (!alertEl) return;
  alertEl.style.display = 'block';
  if (type === 'error') {
    alertEl.style.background = '#fef2f2';
    alertEl.style.color = '#b91c1c';
    alertEl.style.border = '1px solid #fecaca';
  } else {
    alertEl.style.background = '#ecfdf5';
    alertEl.style.color = '#047857';
    alertEl.style.border = '1px solid #a7f3d0';
  }
  alertEl.textContent = message;
}

function confirmOrderDelete() {
  if (!currentDeleteOrderRef) return;

  const btn = document.getElementById('btn-confirm-delete-order');
  if (btn) {
    btn.disabled = true;
    btn.dataset.origHtml = btn.innerHTML;
    btn.innerHTML = `<span style="display:inline-block; animation:spin 1s linear infinite;">⏳</span> Deleting Order...`;
  }

  fetch('/admin/orders/confirm-delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      order_ref: currentDeleteOrderRef
    })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.origHtml;
      }
      showDelModalAlert('error', data.error || 'Failed to delete order.');
      return;
    }

    // Success!
    closeDeleteOrderModal();

    if (typeof showToast === 'function') {
      showToast('success', data.message || 'Order permanently deleted.');
    } else {
      alert(data.message || 'Order permanently deleted.');
    }

    // Check if we are on the Orders List table
    const rowEl = document.getElementById('order-row-' + data.deleted_id) || document.querySelector(`tr[id*="${currentDeleteOrderRef}"]`);
    if (rowEl) {
      rowEl.style.transition = 'all 0.4s ease';
      rowEl.style.opacity = '0';
      rowEl.style.transform = 'scale(0.95)';
      setTimeout(() => {
        rowEl.remove();
        // Check if table empty
        const tbody = document.getElementById('admin-orders-tbody');
        if (tbody && tbody.children.length === 0) {
          const wrapper = document.getElementById('admin-orders-table-wrapper');
          const noOrders = document.getElementById('no-orders-msg');
          if (wrapper) wrapper.style.display = 'none';
          if (noOrders) noOrders.style.display = 'block';
        }
      }, 400);
    } else {
      // If on the Order Detail page, redirect back to orders tab
      setTimeout(() => {
        window.location.href = '/admin#orders-tab';
      }, 700);
    }
  })
  .catch(err => {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.origHtml;
    }
    showDelModalAlert('error', 'Network error during order deletion.');
  });
}
</script>
